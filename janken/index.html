<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>じゃんけん</title>
</head>
<body>
  <main>
    <h1>じゃんけん</h1>
    <p>出す手を選択して相手に勝利しよう！</p>

    <p>相手の手</p>
    <p id="opponent-hand" aria-live="polite"></p>

    <p id="result" aria-live="polite"></p>

    <p>何を出す？</p>
    <button type="button" data-hand="rock">グー</button>
    <button type="button" data-hand="scissors">チョキ</button>
    <button type="button" data-hand="paper">パー</button>
    <button type="button" id="reset">もう一度</button>
  </main>
<script src="script.js"></script>
</body>
</html>
